name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Extension syntax
        run: node --check extension/service-worker.js
      - name: Build release binaries
        run: swift build -c release --product DeskriptionsLab && swift build -c release --product deskriptions-bridge
